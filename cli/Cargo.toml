[package]
name = "openhhkb"
version = "0.1.0"
edition = "2021"
description = "Open remapper / updater for HHKB and Realforce (Topre) keyboards"
license = "CC0-1.0"

[[bin]]
name = "openhhkb"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
anyhow = "1"

[profile.release]
strip = true
